[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuseki-proto-tool"
version = "0.1.0"
description = "Maintenance CLI for the EDO/Regimo Fuseki prototype (start/stop, backup/restore, load, wipe)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rocrate>=0.16.0",  # CF2-006 RO-Crate generation from the internal format
]
license = { text = "MIT" }

[project.scripts]
fuseki-proto = "fuseki_proto.cli:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
