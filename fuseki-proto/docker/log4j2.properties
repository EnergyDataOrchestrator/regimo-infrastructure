# Apache Jena Fuseki default logging configuration (log4j2),
# from the official jena-fuseki-docker module.
#
# https://github.com/apache/jena/blob/main/jena-fuseki2/jena-fuseki-docker/log4j2.properties
status = error

# the appenders:

appender.console.type = Console
appender.console.name = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%t] %-30c - %m%n

# server:

logger.fusekiServer.name = org.apache.jena.fuseki.Server
logger.fusekiServer.level = INFO

logger.fusekiNetty.name = org.apache.jena.fuseki
logger.fusekiNetty.level = INFO

rootLogger.level = INFO
rootLogger.appenderRef.stdout.ref = CONSOLE
