# --- Connectivity ---
broker.id=1
# Two listeners (Confluent internal + external convention):
#   PLAINTEXT      -> container network  (kafka:29092), inter-broker/controller
#   PLAINTEXT_HOST -> host port 9092      (localhost:9092) for host clients
listeners=PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
advertised.listeners=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
inter.broker.listener.name=PLAINTEXT
num.network.threads=3
num.io.threads=8

# --- Log Retention (Crucial for Research Data) ---
# Retain data for 7 days or until 10GB is reached
log.retention.hours=168
log.retention.bytes=10737418240
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# --- Zookeeper Connection ---
zookeeper.connect=zookeeper:2181
zookeeper.connection.timeout.ms=18000

# --- Topic Management ---
# Allow sockets to create topics on the fly (useful for dev)
auto.create.topics.enable=true
default.replication.factor=1
num.partitions=3
# Single-broker dev cluster: the internal __consumer_offsets topic defaults to
# replication factor 3 (Kafka's default), which exceeds a 1-broker cluster and
# blocks the group coordinator (COORDINATOR_NOT_AVAILABLE). Lower it to 1.
offsets.topic.replication.factor=1